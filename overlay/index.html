<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
  />
  <title>Desktop Agent</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --bg-elevated: #232326;
      --stroke: rgba(255, 255, 255, 0.10);
      --stroke-soft: rgba(255, 255, 255, 0.06);
      --text: #e8e8ea;
      --text-dim: #9a9aa0;
      --idle: #8e8e93;
      --running: #32d74b;
      --error: #ff453a;
      --radius-window: 14px;
      --radius-frame: 9px;
    }

    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }

    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      font: 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app { height: 100%; padding: 0; }

    #card {
      position: relative;
      height: 100%;
      background: rgba(28, 28, 30, 0.72);
      -webkit-backdrop-filter: blur(26px) saturate(1.35);
      backdrop-filter: blur(26px) saturate(1.35);
      /* 最外层一圈 1px 细黑边（border 占位，不遮画面）；白色高光描边挪到 inset 阴影，保留玻璃感 */
      border: 1px solid rgba(0, 0, 0, 0.92);
      border-radius: var(--radius-window);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.10), 0 8px 28px rgba(0, 0, 0, 0.38);
    }

    /* 只有边缘/顶部 8px 是拖拽条：其余区域点击穿透到下面的 DSH */
    .drag-strip { position: absolute; z-index: 3; -webkit-app-region: drag; }
    #drag-top { left: 0; right: 0; top: 0; height: 8px; }
    #drag-left { left: 0; top: 8px; bottom: 8px; width: 8px; }
    #drag-right { right: 0; top: 8px; bottom: 8px; width: 8px; }
    #drag-bottom { left: 0; right: 0; bottom: 0; height: 8px; }
    #card:hover { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 8px 28px rgba(0, 0, 0, 0.38); }

    /* 没有顶栏：画面直接铺满 */

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--idle);
      transition: background 160ms ease;
    }
    .dot.running { background: var(--running); animation: dot-breathe 2.6s ease-in-out infinite; }
    .dot.error { background: var(--error); }
    @keyframes dot-breathe { 0%, 100% { opacity: 0.65; } 50% { opacity: 1; } }

    /* 底部状态胶囊：画面是主体，状态是配色克制的一行小字 */
    #statusbar {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100% - 48px);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(12, 12, 14, 0.5);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      backdrop-filter: blur(10px) saturate(1.2);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.22);
      font-size: 10px;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.76);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      transition: opacity 160ms ease;
    }
    #statusbar.on { opacity: 1; }
    #statusbar.error {
      background: rgba(36, 14, 14, 0.72);
      border-color: rgba(255, 69, 58, 0.28);
      color: #ffb4ae;
    }
    #statusbar .bar-text {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
    }
    #statusbar #elapsed {
      flex: 0 0 auto;
      color: rgba(255, 255, 255, 0.42);
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
    }
    #statusbar.error #elapsed { color: rgba(255, 180, 174, 0.65); }
    #statusbar #fix {
      display: none;
      flex: 0 0 auto;
      -webkit-app-region: no-drag;
      padding: 2px 7px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.92);
      font: inherit;
      font-size: 9.5px;
      line-height: 1.2;
      cursor: pointer;
      pointer-events: auto;
    }
    #statusbar #fix.show { display: inline-block; }
    #statusbar #fix:hover { background: rgba(255, 255, 255, 0.2); }
    #statusbar.error #fix {
      border-color: rgba(255, 180, 174, 0.4);
      background: rgba(255, 69, 58, 0.16);
      color: #ffd9d6;
    }

    #close {
      position: absolute;
      top: 9px;
      right: 9px;
      z-index: 6;
      -webkit-app-region: no-drag;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 140ms ease;
    }
    #card:hover #close { opacity: 1; }

    /* 放大：切到屏幕居中 4:3 */
    #expand {
      position: absolute;
      top: 9px;
      right: 37px;
      z-index: 6;
      -webkit-app-region: no-drag;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 140ms ease;
    }
    #card:hover #expand { opacity: 1; }
    #expand:hover { background: rgba(0, 0, 0, 0.7); }
    #close:hover { background: rgba(0, 0, 0, 0.7); }

    /* 画面区域 */
    #stage {
      position: absolute;
      inset: 5px;
      border-radius: calc(var(--radius-window) - 5px);
      background: #0b0b0c;
      overflow: hidden;
    }

    #thumb-backdrop,
    #thumb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 120ms ease;
    }
    #thumb-backdrop { object-fit: cover; filter: blur(14px); opacity: 0; }
    #thumb { object-fit: contain; }
    #thumb-backdrop.visible { opacity: 0.5; }
    #thumb.visible { opacity: 1; }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      color: #6b6b70;
    }
    #placeholder.hidden { display: none; }

    /* 虚拟鼠标：干净的白色指针 */
    #vcur {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      display: none;
      pointer-events: none;
      z-index: 4;
      will-change: transform;
      transition: transform 70ms linear;
    }
    #vcur.on { display: block; }
    #vcur-arrow {
      position: absolute;
      left: -1px;
      top: -1px;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
    }
    /* 点击波纹：/frame 的 cursor.click=true 时触发一次 */
    #vcur-ring {
      position: absolute;
      left: -10px;
      top: -10px;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(90, 170, 255, 0.95);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    #vcur.clicking #vcur-ring { animation: vcur-click 420ms ease-out 1; }
    @keyframes vcur-click {
      0% { transform: scale(0.35); opacity: 0.95; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* 日志抽屉：只在悬停/点击时出现 */
    #logs {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 44px;
      max-height: 62%;
      padding: 6px 2px 6px 8px;
      border-radius: var(--radius-frame);
      background: rgba(20, 20, 22, 0.97);
      border: 1px solid var(--stroke-soft);
      overflow: hidden;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    #logs.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #loglist {
      margin: 0;
      padding: 0;
      list-style: none;
      overflow-y: auto;
      max-height: 210px;
      font-size: 11px;
      line-height: 1.55;
      color: #b6b6ba;
    }
    #loglist li {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 1px 6px 1px 0;
    }
    #loglist li .t {
      color: #6e6e73;
      margin-right: 6px;
      font-variant-numeric: tabular-nums;
    }
    #logs::-webkit-scrollbar, #loglist::-webkit-scrollbar { width: 6px; }
    #logs::-webkit-scrollbar-thumb, #loglist::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.14);
      border-radius: 3px;
    }

    /* 左上角：极小的日志入口（平时只有一个淡省略号，悬停才显示会话名） */
    #pill {
      position: absolute;
      left: 9px;
      top: 6px;
      z-index: 5;
      -webkit-app-region: no-drag;
      appearance: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 5px;
      border: 0;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.16);
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      max-width: calc(100% - 70px);
      opacity: 0.55;
      transition: opacity 140ms ease, background 140ms ease;
    }
    #card:hover #pill { opacity: 1; background: rgba(0, 0, 0, 0.34); }
    #pill .hint { font-size: 12px; line-height: 1; letter-spacing: 1px; }
    /* 多会话：非 default 会话在悬停时显示一小段会话名 */
    #pill #sess {
      display: none;
      flex: 0 0 auto;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.55);
      font-variant-numeric: tabular-nums;
    }
    #card:hover #pill #sess.on { display: inline-block; }
  </style>
</head>
<body>
  <div id="app">
    <div id="card">
      <div id="stage">
        <img id="thumb-backdrop" alt="" draggable="false" />
        <img id="thumb" alt="被控窗口实时画面" draggable="false" />
        <div id="vcur" aria-hidden="true">
          <svg id="vcur-arrow" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
            <path d="M3 1.5 L3 17.2 L7.2 13.1 L9.7 18.4 L12 17.3 L9.5 12.2 L15.1 12.2 Z"
                  fill="#ffffff" stroke="#000000" stroke-width="1.1" stroke-linejoin="round" stroke-opacity="0.85"/>
          </svg>
          <span id="vcur-ring"></span>
        </div>
        <div id="placeholder">等待画面</div>

        <div id="statusbar" aria-live="polite">
          <span id="bar-dot" class="dot idle"></span>
          <span class="bar-text" id="bar-text">待命</span>
          <span id="elapsed"></span>
          <button id="fix" type="button" aria-label="修复画面"></button>
        </div>
      </div>

      <div id="drag-top" class="drag-strip" aria-hidden="true"></div>
      <div id="drag-left" class="drag-strip" aria-hidden="true"></div>
      <div id="drag-right" class="drag-strip" aria-hidden="true"></div>
      <div id="drag-bottom" class="drag-strip" aria-hidden="true"></div>

      <button id="expand" type="button" title="放大（按画面比例）" aria-label="放大">⤢</button>
      <button id="close" type="button" title="关闭（Esc）" aria-label="关闭">✕</button>

      <button id="pill" type="button" title="查看动作日志（悬停打开，点击固定）" aria-label="日志">
        <span id="sess" aria-hidden="true"></span>
        <span class="hint" aria-hidden="true">⋯</span>
      </button>

      <div id="logs" aria-hidden="true">
        <ul id="loglist" role="log"></ul>
      </div>

    </div>
  </div>

  <script src="./renderer.js" defer></script>
</body>
</html>
