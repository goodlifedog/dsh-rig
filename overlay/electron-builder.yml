appId: com.goodlifedog.dsh-desktop-agent
productName: Desktop Agent
copyright: Copyright © 2026 goodlifedog
directories:
  output: ../dist-app
# 用通配而不是逐个列：main.js 会 require 一堆拆分出来的模块（recover/host-select/session-policy…），
files:
  - "*.js"
  - index.html
  - package.json
  - "!start.mjs"      # 开发入口，打包版不需要
  - "!smoke-http.js"  # 冒烟脚本，打包版不需要
  - "!node_modules/**"
extraResources:
  - from: ../core
    to: core
    filter:
      - "**/*"
  - from: ../third_party
    to: third_party
  - from: ../flow
    to: flow
mac:
  target:
    - dir
    - dmg
  category: public.app-category.productivity
  identity: "-"  # ad-hoc 签名，本地可用
dmg:
  title: Desktop Agent
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
