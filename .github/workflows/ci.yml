name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 单元测试
        run: npm test
      - name: 语法检查
        run: npm run check
      - name: 平台自检（允许失败，仅提供信息）
        run: node core/platform-smoke.mjs
        continue-on-error: true
